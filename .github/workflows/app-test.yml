name: App CI/CD

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    name: Build & Test Application
    runs-on: ubuntu-latest

    services:
      vault:
        image: hashicorp/vault:latest
        ports:
          - 8200:8200
        env:
          VAULT_DEV_ROOT_TOKEN_ID: root
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        options: >-
          --health-cmd "vault status -address=http://127.0.0.1:8200"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install backend dependencies
        run: |
          cd src/back-end
          npm install

      - name: Install frontend dependencies
        run: |
          cd src/front-end
          npm install

      - name: Lint backend (if applicable)
        run: |
          cd src/back-end
          if [ -f "package.json" ] && grep -q "\"lint\"" package.json; then
            npm run lint
          else
            echo "No lint script found, skipping"
          fi
        continue-on-error: true

      - name: Build frontend
        run: |
          cd src/front-end
          npm run build

      - name: Check TypeScript compilation
        run: |
          cd src/front-end
          npx tsc --noEmit

      - name: Verify build artifacts
        run: |
          if [ ! -d "src/front-end/dist" ]; then
            echo "❌ Frontend build failed - dist directory not found"
            exit 1
          fi
          echo "✅ Frontend built successfully"

      - name: Test backend server starts
        run: |

          ls -la
          cd src/back-end
          # Create the secrets directory required by vault_launcher.js
          mkdir -p vault_handler/secrets
          mkdir -p app/certs
          touch app/certs/vault.crt
          
          timeout 10s node server.js &
          sleep 3
          if pgrep -f "node server.js" > /dev/null; then
            echo "✅ Backend server started successfully"
            pkill -f "node server.js"
          else
            echo "❌ Backend server failed to start"
            exit 1
          fi
        env:
          NODE_ENV: test
          VAULT_ADDR: https://localhost:8200
          VAULT_TOKEN: root

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend Docker image
        run: |
          docker build -t ft-trans-frontend:test ./src/front-end

      - name: Build backend Docker image
        run: |
          docker build -t ft-trans-backend:test ./src/back-end

      - name: Verify images built
        run: |
          docker images | grep ft-trans
