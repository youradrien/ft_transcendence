server {
    listen 443 ssl;
    client_max_body_size 5M;

    ssl_certificate     /etc/nginx/ssl/transssl.crt;
    ssl_certificate_key /etc/nginx/ssl/transssl.key;

    # -------------------------------------------------------------
    # 🔐 HEADERS DE SÉCURITÉ
    # -------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), fullscreen=(self)" always;
    add_header X-XSS-Protection "1; mode=block" always;

    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # -------------------------------------------------------------
    # 🛡️ RESTRICTION DES MÉTHODES HTTP
    # (GET, POST, HEAD, PUT, DELETE, PATCH, OPTIONS autorisés)
    # -------------------------------------------------------------
    if ($request_method !~ ^(GET|POST|HEAD|PUT|DELETE|PATCH|OPTIONS)$) {
        return 405;
    }

    # -------------------------------------------------------------
    # 🔄 ROUTES
    # -------------------------------------------------------------
    location /uploads/ {
        proxy_pass https://backend:3010;
        proxy_ssl_verify off;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass https://backend:3010;
        proxy_ssl_verify off;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass https://frontend:443;
        proxy_ssl_verify off;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
